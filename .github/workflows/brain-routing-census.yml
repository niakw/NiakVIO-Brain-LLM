name: Brain Routing Census

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: brain

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - run: python -m pip install -e brain

      - name: Build public experience memory
        run: |
          python brain/scripts/import_public_niakvio.py             --niakvio-root niakvio             --output public-experience.jsonl

      - name: Route all Brain-required providers
        run: |
          python brain/scripts/route_batch_from_checkout.py             --niakvio-root niakvio             --experience public-experience.jsonl             --mode brain             --output brain-routing.jsonl             --summary brain-routing-summary.json
          cat brain-routing-summary.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: brain-routing-census
          path: |
            brain-routing.jsonl
            brain-routing-summary.json
