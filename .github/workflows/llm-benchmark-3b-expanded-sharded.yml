name: Qwen 3B Expanded Sharded Benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/brain-llm-v0
    paths:
      - ".github/workflows/llm-benchmark-3b-expanded-sharded.yml"

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          path: brain

      - uses: actions/checkout@v4
        with:
          repository: niakw/NiakVIO
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e brain

      - name: Build memories and expanded corpus
        run: |
          python brain/scripts/import_public_niakvio.py             --niakvio-root niakvio             --output public-experience.jsonl
          python brain/scripts/import_public_docs.py             --niakvio-root niakvio             --config brain/config/document_sources.json             --output public-documents.jsonl
          python brain/benchmark/build_public_golden_cases.py             --seed niakvio/automation/brain-historical-experience-seed.json             --output expanded-golden-cases.jsonl
          python brain/benchmark/shard_jsonl.py             --input expanded-golden-cases.jsonl             --output shard-cases.jsonl             --shard-index ${{ matrix.shard }}             --shard-count 2

      - uses: actions/cache@v4
        id: llama-cache
        with:
          path: llama.cpp
          key: llama-cpp-server-linux-v1

      - if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build             -DGGML_NATIVE=OFF             -DLLAMA_CURL=ON             -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j2 --target llama-server

      - if: steps.llama-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: qwen25-coder-3b-q4-km-v1

      - name: Start Qwen2.5 Coder 3B
        run: |
          ./llama.cpp/build/bin/llama-server             -hf Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M             --host 127.0.0.1             --port 8080             -c 4096             -np 1             > llama-server.log 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat llama-server.log
          exit 1

      - name: Run shard benchmark
        run: |
          python brain/benchmark/golden_model_benchmark.py             --cases shard-cases.jsonl             --experience public-experience.jsonl             --documents public-documents.jsonl             --endpoint http://127.0.0.1:8080             --model qwen2.5-coder-3b             | tee expanded-benchmark-${{ matrix.shard }}.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3b-expanded-shard-${{ matrix.shard }}
          path: |
            expanded-benchmark-${{ matrix.shard }}.json
            shard-cases.jsonl
            llama-server.log

  merge:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brain

      - uses: actions/download-artifact@v4
        with:
          pattern: qwen3b-expanded-shard-*
          path: shards
          merge-multiple: true

      - name: Merge reports
        run: |
          python brain/benchmark/merge_benchmark_reports.py             shards/expanded-benchmark-0.json             shards/expanded-benchmark-1.json             --output expanded-benchmark-merged.json
          cat expanded-benchmark-merged.json

      - uses: actions/upload-artifact@v4
        with:
          name: qwen3b-expanded-merged
          path: expanded-benchmark-merged.json
