name: NiakVIO LLM Golden Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen25:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: brain
      - uses: actions/checkout@v4
        with:
          repository: niakw/NiakVIO
          path: niakvio
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e brain
      - name: Build current NiakVIO memories
        run: |
          python brain/scripts/import_public_niakvio.py --niakvio-root niakvio --output public-experience.jsonl
          python brain/scripts/import_public_docs.py --niakvio-root niakvio --config brain/config/document_sources.json --output public-documents.jsonl
      - uses: actions/cache@v4
        id: llama-cache
        with:
          path: llama.cpp
          key: llama-cpp-server-linux-v1
      - if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build -DGGML_NATIVE=OFF -DLLAMA_CURL=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j2 --target llama-server
      - if: steps.llama-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: qwen25-coder-15b-q4-km-v1
      - name: Start Qwen2.5 Coder 1.5B
        run: |
          ./llama.cpp/build/bin/llama-server -hf Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M --host 127.0.0.1 --port 8080 -c 4096 -np 1 > llama-server.log 2>&1 &
          for i in $(seq 1 120); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat llama-server.log
          exit 1
      - name: Run golden benchmark
        run: |
          python brain/benchmark/golden_model_benchmark.py --cases brain/benchmark/golden_cases.jsonl --experience public-experience.jsonl --documents public-documents.jsonl --endpoint http://127.0.0.1:8080 --model qwen2.5-coder-1.5b | tee golden-benchmark.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen25-niakvio-golden-benchmark
          path: |
            golden-benchmark.json
            llama-server.log
