name: Brain - CPU Model Challenger (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmark/model-challenger.trigger'

permissions:
  contents: read

concurrency:
  group: niakvio-brain-cpu-challenger
  cancel-in-progress: false

jobs:
  qwen35-9b-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install Brain without remote API configuration
        run: python -m pip install -e .
      - name: Run contracts before inference
        run: |
          set -euo pipefail
          python -m unittest tests.test_cross_topology_family_wave -v
          python -m unittest tests.test_no_paid_api -v
          test -s benchmark/golden_cases.jsonl
      - name: Download verified official llama.cpp CPU runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .challenger/runtime
          curl -fLsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11140/llama-b11140-bin-ubuntu-x64.tar.gz \
            -o .challenger/llama.tar.gz
          printf '%s  %s\n' '460c45fa8a9ebc36c9b08e3a15c06dbdbeb312c6308599521c84d9e7f92a268b' '.challenger/llama.tar.gz' | sha256sum -c -
          tar -xf .challenger/llama.tar.gz -C .challenger/runtime
          test -n "$(find .challenger/runtime -type f -name llama-server -print -quit)"
      - name: Download hash-pinned Qwen3.5-9B Q4 (no GitHub Models API)
        shell: bash
        run: |
          set -euo pipefail
          df -h .
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 2100 \
            'https://huggingface.co/SoAIHQ/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf' \
            -o .challenger/qwen35-9b-q4.gguf
          printf '%s  %s\n' 'ef6f244d63abcba4f8d30b7cbd9369e9e798fc33cf21109889373f59af329c93' '.challenger/qwen35-9b-q4.gguf' | sha256sum -c -
          echo 'FIELD_BRAIN_CHALLENGER_WEIGHTS verified=true model=qwen35-9b-q4'
      - name: Start loopback-only CPU challenger
        shell: bash
        run: |
          set -euo pipefail
          binary="$(find .challenger/runtime -type f -name llama-server -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" -m .challenger/qwen35-9b-q4.gguf \
            --alias qwen35-9b --host 127.0.0.1 --port 8080 \
            -t 4 -c 8192 -np 1 > .challenger/server.log 2>&1 &
          for n in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo 'FIELD_BRAIN_CHALLENGER_SERVER available=true'
              exit 0
            fi
            sleep 2
          done
          echo 'FIELD_BRAIN_CHALLENGER_SERVER available=false'
          tail -40 .challenger/server.log
          exit 1
      - name: Run fixed public six-case causal benchmark (no provider mutation)
        shell: bash
        run: |
          set -euo pipefail
          : > .challenger/experience.jsonl
          : > .challenger/documents.jsonl
          timeout 50m python benchmark/golden_model_benchmark.py \
            --cases benchmark/golden_cases.jsonl \
            --experience .challenger/experience.jsonl \
            --documents .challenger/documents.jsonl \
            --endpoint http://127.0.0.1:8080 --model qwen35-9b \
            --output .challenger/result.json
          python -m json.tool .challenger/result.json > /dev/null
          python - <<'PY'
          import json
          r=json.load(open(".challenger/result.json"))
          if r["incomplete"] or r["completedCases"] != r["cases"]:
              raise SystemExit("benchmark incomplete: do not publish a model quality score")
          PY
          python scripts/compare_model_benchmarks.py .challenger/result.json > .challenger/quality.json
          python - <<'PY'
          import json
          r=json.load(open('.challenger/result.json'))
          print('FIELD_BRAIN_CHALLENGER_DIAGNOSTIC model=%s cases=%d full_rate=%.3f acceptance=not-run decoded=not-run' %
                (r['model'],r['cases'],r['rates']['fully_compliant']))
          PY
      - name: Upload safe diagnostic report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-qwen35-9b-cpu-diagnostic
          path: |
            .challenger/result.json
            .challenger/quality.json
          if-no-files-found: warn
          retention-days: 7
