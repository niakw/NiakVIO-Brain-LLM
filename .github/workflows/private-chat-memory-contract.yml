name: Private NiakVIO Chat Memory Contract

on:
  workflow_dispatch:
  schedule:
    - cron: "47 4 * * 1"

permissions:
  contents: read

concurrency:
  group: private-niakvio-chat-memory-contract
  cancel-in-progress: true

jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Brain LLM
        uses: actions/checkout@v4
        with:
          path: brain

      - name: Checkout niakvio-private read-only
        uses: actions/checkout@v4
        with:
          repository: niakw/niakvio-private
          ref: main
          token: ${{ secrets.NIAKVIO_PRIVATE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Brain package
        run: python -m pip install -e brain

      - name: Build ephemeral private chat memory
        run: |
          python brain/scripts/import_private_chat_project.py \
            --project-root private/raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8 \
            --output private-chat-documents.jsonl \
            | tee private-memory-report.json

      - name: Validate private chat retrieval
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from niakvio_brain_llm.document_memory import DocumentStore

          report = json.loads(Path("private-memory-report.json").read_text())
          assert report["source_conversations"] >= 1
          assert report["indexed_conversations"] >= 1
          assert report["indexed_conversations"] <= report["source_conversations"]
          assert report["documents"] >= report["indexed_conversations"]
          assert report["raw_tool_messages_indexed"] is False
          assert report["proof_authority"] is False

          store = DocumentStore.from_jsonl("private-chat-documents.jsonl")
          assert store.rows, "private chat memory is empty"
          assert all(row.get("private_memory") is True for row in store.rows)
          assert all(row.get("proof_authority") is False for row in store.rows)
          assert not any(row.get("role") == "private_chat_tool" for row in store.rows)
          assert all("conversation_title" not in row for row in store.rows)

          # This is a live private corpus, not a frozen Movix fixture. Choose
          # an actual indexed provider token rather than assuming a historical
          # provider/failure pair must survive transcript selection.
          provider_candidates = (
              "4khdhub", "allanime", "allwish", "animekai", "animesalt",
              "animesama-co", "animesultra", "animevost-fr", "animevostfr",
              "flemmix", "mallumv", "moviebox", "moviesmod", "uhdmovies",
              "vidfast", "vostfree", "yflix",
          )
          def contains_provider(text, provider):
              return bool(re.search(
                  r"(?<![a-z0-9])" + re.escape(provider) + r"(?![a-z0-9])",
                  text.casefold(),
              ))

          # A boundary match in raw text is not necessarily a DocumentStore
          # token: its tokenizer keeps '/' and '.' within tokens. A provider
          # mentioned only in a URL/path can therefore be indexed but not
          # retrievable by an exact provider query. Check the actual top hits
          # and fall through to the next candidate rather than failing early.
          provider = None
          hits = []
          for candidate in provider_candidates:
              if not any(contains_provider(str(row.get("text") or ""), candidate)
                         for row in store.rows):
                  continue
              candidate_hits = store.search({"provider_id": candidate}, limit=6)
              if any(
                  contains_provider(
                      str(hit.get("heading") or "") + "\n" + str(hit.get("text") or ""),
                      candidate,
                  )
                  for hit in candidate_hits
              ):
                  provider = candidate
                  hits = candidate_hits
                  break
          assert provider, "private chat memory has no retrievable repair-provider evidence"
          assert hits, "private chat memory failed retrieval for an indexed provider"

          sensitive = re.compile(
              r"github_pat_[A-Za-z0-9_]+|gh[pousr]_[A-Za-z0-9]{20,}|"
              r"Bearer\s+[A-Za-z0-9._~+/=-]{12,}|"
              r"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}|"
              r"(?<!\d)(?:\+33[ .-]?|0)[1-9](?:[ .-]?\d{2}){4}(?!\d)|"
              r"(?<![\d.])(?:\d{1,3}\.){3}\d{1,3}(?![\d.])|"
              r"/Users/[^/\s]+|/home/[^/\s]+",
              re.I,
          )
          assert not any(sensitive.search(str(row.get("text") or "")) for row in store.rows)

          print(json.dumps({
              "private_documents": len(store.rows),
              "retrieval_hits": len(hits),
              "top_roles": [row.get("role") for row in hits[:3]],
              "private_content_uploaded": False,
          }))
          PY

      - name: Remove ephemeral private index
        if: always()
        run: rm -f private-chat-documents.jsonl
