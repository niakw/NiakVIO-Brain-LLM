name: CLEAN - Retire merged PR branches
on:
  push:
    branches: [main]
    paths:
      - '.github/triggers/merged-pr-branch-cleanup-2026-11-06.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'niakw/NiakVIO-Brain-LLM'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify exact branch cleanup allowlist before mutation
        run: python3 tests/cleanup_merged_pr_branches_test.py
      - name: Remove only current exact merged PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/cleanup_merged_pr_branches.py
