name: SEC - CodeQL maintained Brain source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: niakvio-brain-codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            category: /language:python
          - language: actions
            category: /language:actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL security-extended
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze current Brain source
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: ${{ matrix.category }}

  result:
    name: CodeQL · maintained Brain
    needs: [analyze]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require full analysis matrix
        env:
          MATRIX_RESULT: ${{ needs.analyze.result }}
        run: test "$MATRIX_RESULT" = success
