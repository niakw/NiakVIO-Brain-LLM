name: NiakVIO Private-Guided Advisor

on:
  push:
    branches: [main]
    paths:
      - ".github/triggers/niakvio-guidance.json"
  workflow_dispatch:
    inputs:
      niakvio_sha:
        description: "Exact NiakVIO main SHA to advise"
        required: false
        default: ""
      brain_sha:
        description: "Exact Brain SHA pinned across continuation pages"
        required: false
        default: ""
      target_providers:
        description: "Optional comma-separated exact Repair cohort; empty auto-unions repairQueue with current static/dynamic completeness debt"
        required: false
        default: ""
      page_size:
        description: "Bounded providers per guidance page (1..12)"
        required: false
        default: "9"
      model_profile:
        description: "Explicit local CPU model profile; larger model is challenger-only"
        required: false
        default: "qwen25-coder-3b"
        type: choice
        options: [qwen25-coder-3b, qwen35-9b]

permissions:
  contents: write
  actions: write

concurrency:
  # New trigger pushes supersede older unpinned advisor cycles instead of
  # burning local-model compute on stale architecture. Explicit continuation pages keep
  # their pinned Brain SHA and serialize independently until the semantic
  # publication guard accepts or rejects them.
  group: niakvio-private-guidance-v4-${{ (github.event_name == 'workflow_dispatch' && inputs.brain_sha) || 'current' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  guidance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Brain LLM
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.brain_sha || github.sha }}
          path: brain
          fetch-depth: 0

      - name: Select exact NiakVIO source
        id: source
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.niakvio_sha || '' }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-}"
          if [ -z "$sha" ] && [ -f brain/.github/triggers/niakvio-guidance.json ]; then
            sha="$(python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("brain/.github/triggers/niakvio-guidance.json").read_text())
          print(str(d.get("niakvio_sha") or "").strip().lower())
          PY
            )"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "exact NiakVIO SHA required" >&2; exit 2; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FIELD_NIAKVIO_GUIDANCE_SOURCE sha=$sha"

      - name: Checkout exact NiakVIO source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO
          ref: ${{ steps.source.outputs.sha }}
          path: niakvio
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact requested Repair cohort
        id: cohort
        shell: bash
        env:
          INPUT_TARGETS: ${{ inputs.target_providers || '' }}
        run: |
          set -euo pipefail
          PYTHONPATH=brain/src python - <<'PY'
          import json
          from pathlib import Path
          from niakvio_brain_llm.provider_context import (
              audit_current_dynamic_variant_coverage,
              audit_registered_runtime_variant_coverage,
          )

          audit=audit_registered_runtime_variant_coverage("niakvio")
          dynamic=audit_current_dynamic_variant_coverage("niakvio")
          Path("niakvio-runtime-variant-coverage.json").write_text(
              json.dumps(audit,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          Path("niakvio-dynamic-variant-coverage.json").write_text(
              json.dumps(dynamic,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8",
          )
          print(
              "FIELD_NIAKVIO_RUNTIME_VARIANT_COVERAGE "
              f"providers={int(audit.get('providerCount') or 0)} "
              f"high={len(audit.get('highRiskProviders') or [])} "
              f"review={len(audit.get('reviewProviders') or [])} "
              f"dynamic_high={len(dynamic.get('highRiskProviders') or [])}"
          )
          PY
          PYTHONPATH=brain/src python - "$RUNNER_TEMP/niakvio-guidance-targets.txt" "$INPUT_TARGETS" "niakvio-runtime-variant-coverage.json" "niakvio-dynamic-variant-coverage.json" <<'PY'
          import json,sys
          from pathlib import Path
          from niakvio_brain_llm.provider_context import published_provider_ids

          out=Path(sys.argv[1])
          raw=str(sys.argv[2] or "").strip()
          coverage=json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          dynamic=json.loads(Path(sys.argv[4]).read_text(encoding="utf-8"))
          coverage_high={
              str(value or "").strip().lower().replace("_","-")
              for value in coverage.get("highRiskProviders") or []
              if str(value or "").strip()
          }
          dynamic_high={
              str(value or "").strip().lower().replace("_","-")
              for value in dynamic.get("highRiskProviders") or []
              if str(value or "").strip()
          }
          trigger=Path("brain/.github/triggers/niakvio-guidance.json")
          trigger_values=[]
          if not raw and trigger.is_file():
              data=json.loads(trigger.read_text(encoding="utf-8"))
              trigger_values=data.get("requested_repair_queue") or []
          if raw:
              values=raw.split(",")
          else:
              values=list(trigger_values)

          census=json.loads(Path("niakvio/automation/provider-census-status.json").read_text(encoding="utf-8"))
          current=published_provider_ids("niakvio",active_only=True)
          print(
              "FIELD_NIAKVIO_GUIDANCE_PROJECTION_AUTHORITY "
              f"providers={len(current)} source=global-plus-france"
          )
          repair=[
              str(v or "").strip().lower().replace("_","-")
              for v in census.get("repairQueue") or []
              if str(v or "").strip()
              and str(v or "").strip().lower().replace("_","-") in current
          ]
          coverage_high &= current
          dynamic_high &= current
          repair_set=set(repair)
          explicit_allowed=repair_set|coverage_high|dynamic_high
          # An explicit manual input or trigger cohort is exact. Auto-union
          # repair/static/dynamic debt only when no explicit cohort exists.
          if not raw and not trigger_values:
              values=[
                  *repair,
                  *sorted(coverage_high),
                  *sorted(dynamic_high),
              ]
          requested=[]
          seen=set()
          for value in values:
              provider=str(value or "").strip().lower().replace("_","-")
              if provider and provider not in seen:
                  seen.add(provider); requested.append(provider)
          missing=[provider for provider in requested if provider not in explicit_allowed]
          if missing:
              raise SystemExit(
                  "requested Brain LLM cohort is neither current repairQueue nor static/dynamic variant coverage debt: "
                  + ",".join(missing)
              )
          if not requested:
              raise SystemExit("Brain LLM requested cohort is empty")
          out.write_text("\n".join(requested)+"\n",encoding="utf-8")
          print("FIELD_NIAKVIO_GUIDANCE_COHORT providers="+str(len(requested))+" ids="+",".join(requested))
          PY
          count="$(wc -l < "$RUNNER_TEMP/niakvio-guidance-targets.txt" | tr -d ' ')"
          csv="$(paste -sd, "$RUNNER_TEMP/niakvio-guidance-targets.txt")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "csv=$csv" >> "$GITHUB_OUTPUT"

      - name: Select repair-family wave
        id: family_wave
        shell: bash
        run: |
          set -euo pipefail
          git -C brain fetch origin "+refs/heads/niakvio-guidance:refs/remotes/origin/niakvio-guidance" || true
          previous_diagnostics_args=()
          if git -C brain show "refs/remotes/origin/niakvio-guidance:guidance/niakvio-force-diagnostics.json" > "$RUNNER_TEMP/niakvio-force-diagnostics.previous.json" 2>/dev/null; then
            previous_diagnostics_args=(--previous-diagnostics "$RUNNER_TEMP/niakvio-force-diagnostics.previous.json")
          fi
          python brain/scripts/select_niakvio_repair_family_wave.py \
            --targets "$RUNNER_TEMP/niakvio-guidance-targets.txt" \
            --niakvio-root niakvio \
            "${previous_diagnostics_args[@]}" \
            --output "$RUNNER_TEMP/niakvio-guidance-family-wave.txt" \
            --report "$RUNNER_TEMP/niakvio-guidance-family-wave.json"
          count="$(wc -l < "$RUNNER_TEMP/niakvio-guidance-family-wave.txt" | tr -d ' ')"
          csv="$(paste -sd, "$RUNNER_TEMP/niakvio-guidance-family-wave.txt")"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "csv=$csv" >> "$GITHUB_OUTPUT"

      - name: Select fair bounded guidance page
        id: page
        shell: bash
        env:
          PAGE_SIZE: ${{ inputs.page_size || '9' }}
        run: |
          set -euo pipefail
          git -C brain fetch origin "+refs/heads/niakvio-guidance:refs/remotes/origin/niakvio-guidance" || true
          previous_args=()
          if git -C brain rev-parse --verify refs/remotes/origin/niakvio-guidance >/dev/null 2>&1 \
             && git -C brain show refs/remotes/origin/niakvio-guidance:guidance/niakvio-guidance-state.json > "$RUNNER_TEMP/niakvio-guidance-state.previous.json" 2>/dev/null; then
            previous_args=(--previous-state "$RUNNER_TEMP/niakvio-guidance-state.previous.json")
          fi
          brain_sha="$(git -C brain rev-parse HEAD)"
          echo "brain_sha=$brain_sha" >> "$GITHUB_OUTPUT"
          python brain/scripts/select_niakvio_guidance_page.py \
            --targets "$RUNNER_TEMP/niakvio-guidance-targets.txt" \
            --priority-targets "$RUNNER_TEMP/niakvio-guidance-family-wave.txt" \
            "${previous_args[@]}" \
            --source-sha "${{ steps.source.outputs.sha }}" \
            --brain-sha "$brain_sha" \
            --page-size "$PAGE_SIZE" \
            --page-output "$RUNNER_TEMP/niakvio-guidance-page.txt" \
            --state-output "$RUNNER_TEMP/niakvio-guidance-state.next.json"
          count="$(wc -l < "$RUNNER_TEMP/niakvio-guidance-page.txt" | tr -d ' ')"
          csv="$(paste -sd, "$RUNNER_TEMP/niakvio-guidance-page.txt")"
          read -r remaining complete cycle < <(python - "$RUNNER_TEMP/niakvio-guidance-state.next.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(int(d.get("remainingCount") or 0), "true" if d.get("complete") is True else "false", int(d.get("cycle") or 1))
          PY
          )
          test "$count" -gt 0 || { echo "guidance page unexpectedly empty" >&2; exit 1; }
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "csv=$csv" >> "$GITHUB_OUTPUT"
          echo "remaining=$remaining" >> "$GITHUB_OUTPUT"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          echo "cycle=$cycle" >> "$GITHUB_OUTPUT"
      - name: Checkout private NiakVIO project read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/niakvio-private
          ref: main
          token: ${{ secrets.NIAKVIO_PRIVATE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Install Brain package
        run: python -m pip install -e brain

      - name: Mark private ChatGPT mirror as historical when upstream sync is stale
        shell: bash
        run: |
          python - <<'PY'
          import datetime as dt, subprocess
          updated = dt.datetime.fromisoformat(subprocess.check_output(
              ["git", "-C", "private", "log", "-1", "--format=%cI"],
              text=True,
          ).strip())
          age = max(0, (dt.datetime.now(dt.timezone.utc) - updated).days)
          print(f"FIELD_NIAKVIO_PRIVATE_MEMORY_FRESHNESS age_days={age} "
                f"stale={str(age > 14).lower()} "
                "historical_only=true current_proof=false")
          if age > 14:
              print("::warning::The NiakVIO ChatGPT mirror is stale. "
                    "Historical context is still allowed, but current "
                    "replay evidence must override it.")
          PY

      - name: Build bounded public and private memory
        shell: bash
        run: |
          set -euo pipefail
          project="private/raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8"
          test -s "$project/project.json"
          test -s "$project/index.json"
          python brain/scripts/import_public_niakvio.py --niakvio-root niakvio --output public-experience.jsonl
          python brain/scripts/import_public_docs.py             --niakvio-root niakvio             --config brain/config/document_sources.json             --output public-documents.jsonl
          python brain/scripts/import_private_chat_project.py             --project-root "$project"             --output private-documents.jsonl             | tee private-memory-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("private-memory-report.json").read_text())
          assert int(d.get("source_conversations") or 0) > 0, d
          assert int(d.get("indexed_conversations") or 0) > 0, d
          assert int(d.get("documents") or 0) > 0, d
          assert d.get("proof_authority") is False, d
          print("FIELD_NIAKVIO_PRIVATE_MEMORY available=true "
                f"source={d['source_conversations']} indexed={d['indexed_conversations']} documents={d['documents']}")
          PY

      - name: Reuse prior Brain causal diagnosis from guidance branch without authority
        shell: bash
        run: |
          set -euo pipefail
          # The branch contains only prior sanitized hypotheses. Never turn
          # historical LLM conclusions into fresh media/proof/patch authority.
          git -C brain fetch origin "+refs/heads/niakvio-guidance:refs/remotes/origin/niakvio-guidance" || true
          if git -C brain show "refs/remotes/origin/niakvio-guidance:guidance/niakvio-causal-diagnostics.json" > "$RUNNER_TEMP/niakvio-causal-history.json" 2>/dev/null; then
            cp "$RUNNER_TEMP/niakvio-causal-history.json" niakvio/automation/brain-causal-diagnostics-history.json
            echo "FIELD_BRAIN_CAUSAL_HISTORY_IMPORT status=historical_only proof_authority=false mutation_authority=false"
          else
            echo "FIELD_BRAIN_CAUSAL_HISTORY_IMPORT status=not_yet_published"
          fi

      - name: Route exact requested Repair cohort
        id: route
        shell: bash
        run: |
          set -euo pipefail
          provider_args=()
          while IFS= read -r provider; do
            [ -z "$provider" ] || provider_args+=(--provider "$provider")
          done < "$RUNNER_TEMP/niakvio-guidance-page.txt"
          python brain/scripts/route_batch_from_checkout.py \
            --niakvio-root niakvio \
            --experience public-experience.jsonl \
            --mode brain \
            --advisor-only \
            "${provider_args[@]}" \
            --output routing.jsonl \
            --summary routing-summary.json
          python brain/scripts/route_batch_from_checkout.py \
            --niakvio-root niakvio \
            --experience public-experience.jsonl \
            --mode repair \
            "${provider_args[@]}" \
            --output routing-force.jsonl \
            --summary routing-force-summary.json
          python - <<'PY'
          import json,os
          advisor=json.load(open("routing-summary.json"))
          force=json.load(open("routing-force-summary.json"))
          needed=bool(advisor.get("llm_needed")) or bool(force.get("llm_needed"))
          targets=max(int(advisor.get("llm_targets") or 0),int(force.get("llm_targets") or 0))
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("llm_needed="+("true" if needed else "false")+"\n")
              f.write("llm_targets="+str(targets)+"\n")
              f.write("force_llm_needed="+("true" if force.get("llm_needed") else "false")+"\n")
              f.write("force_llm_targets="+str(int(force.get("llm_targets") or 0))+"\n")
          print("FIELD_NIAKVIO_GUIDANCE_ROUTE "
                f"advisor_llm={int(advisor.get('llm_targets') or 0)} "
                f"force_llm={int(force.get('llm_targets') or 0)} "
                f"providers={int(force.get('provider_count') or advisor.get('provider_count') or 0)}")
          PY

      - name: Compile deterministic Force candidates before model
        id: deterministic_force
        shell: bash
        run: |
          set -euo pipefail
          provider_args=()
          while IFS= read -r provider; do
            [ -z "$provider" ] || provider_args+=(--provider "$provider")
          done < "$RUNNER_TEMP/niakvio-guidance-page.txt"
          python brain/scripts/plan_deterministic_force_from_checkout.py \
            --niakvio-root niakvio \
            --experience public-experience.jsonl \
            "${provider_args[@]}" \
            --output private-force-deterministic.jsonl
          count="$(python -c 'from pathlib import Path; p=Path("private-force-deterministic.jsonl"); print(sum(1 for line in p.read_text(encoding="utf-8").splitlines() if line.strip()))')"
          page_count="$(wc -l < "$RUNNER_TEMP/niakvio-guidance-page.txt" | tr -d '[:space:]')"
          test "$page_count" -gt 0 || { echo "empty Brain guidance page" >&2; exit 1; }
          ready=false
          executable=0
          if [ "$count" -gt 0 ]; then
            brain_sha="$(git -C brain rev-parse HEAD)"
            if python brain/scripts/publish_niakvio_force_mutations.py \
              --input private-force-deterministic.jsonl \
              --output "$RUNNER_TEMP/niakvio-force-deterministic.preflight.json" \
              --niakvio-root niakvio \
              --niakvio-sha "${{ steps.source.outputs.sha }}" \
              --brain-llm-sha "$brain_sha"; then
              executable="$(python -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("providerCount") or 0))' "$RUNNER_TEMP/niakvio-force-deterministic.preflight.json")"
              # A single deterministic candidate must not suppress Qwen
              # for the rest of the page. Skip the model only when ALL exact
              # requested providers have executable, sanitized candidates.
              # providerCount is unique and the preflight only receives
              # providers from niakvio-guidance-page.txt. The generated JSONL
              # line count is NOT the requested provider count (historically
              # 1 generated candidate for a 9-provider page).
              if [ "$executable" -eq "$page_count" ]; then
                ready=true
              else
                echo "FIELD_BRAIN_DETERMINISTIC_FORCE_PARTIAL page=$page_count generated=$count executable=$executable action=run-model"
              fi
            fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "FIELD_BRAIN_DETERMINISTIC_FORCE_PREFLIGHT_READY ready=$ready page=$page_count rows=$count executable=$executable"
          if [ "$ready" != "true" ]; then
            deterministic_required="$(python - <<'PY'
          import json
          from pathlib import Path
          path=Path("brain/.github/triggers/niakvio-guidance.json")
          try:
              data=json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              data={}
          print("true" if data.get("require_deterministic_force") is True else "false")
          PY
            )"
            if [ "$deterministic_required" = "true" ]; then
              echo "FIELD_BRAIN_DETERMINISTIC_FORCE_REQUIRED_MISSING required=true" >&2
              exit 42
            fi
          fi

      - name: Resolve bounded local model profile
        # Cheap model-profile *argument* resolution is also needed when the
        # Brain chooses deterministic replay with zero LLM calls. Otherwise
        # plan_batch receives empty timeout/budget flags and aborts before the
        # candidate can be validated. Model downloads/start remain LLM-only.
        if: steps.deterministic_force.outputs.ready != 'true'
        id: model_profile
        shell: bash
        env:
          INPUT_MODEL_PROFILE: ${{ inputs.model_profile || '' }}
        run: |
          set -euo pipefail
          profile="qwen25-coder-3b"
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ]; then
            profile="$(python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("brain/.github/triggers/niakvio-guidance.json").read_text(encoding="utf-8"))
          print(str(data.get("model_profile") or "qwen25-coder-3b").strip())
          PY
            )"
          elif [ -n "${INPUT_MODEL_PROFILE:-}" ]; then
            profile="$INPUT_MODEL_PROFILE"
          fi
          case "$profile" in
            qwen25-coder-3b)
              model="qwen2.5-coder-3b"
              cache_key="qwen25-coder-3b-q4-km-v1"
              force_timeout=180
              provider_budget=600
              advisor_timeout=45
              ;;
            qwen35-9b)
              model="qwen35-9b"
              cache_key="qwen35-9b-q4-km-ef6f244d"
              force_timeout=420
              provider_budget=1500
              advisor_timeout=180
              ;;
            *)
              echo "unsupported local model profile: $profile" >&2
              exit 2
              ;;
          esac
          {
            echo "profile=$profile"
            echo "model=$model"
            echo "cache_key=$cache_key"
            echo "force_timeout=$force_timeout"
            echo "provider_budget=$provider_budget"
            echo "advisor_timeout=$advisor_timeout"
          } >> "$GITHUB_OUTPUT"
          echo "FIELD_BRAIN_LOCAL_MODEL_PROFILE profile=$profile model=$model publication_authority=false"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.route.outputs.llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true'
        id: llama-bin-cache
        with:
          path: llama-prebuilt
          key: llama-cpp-b11140-ubuntu-x64

      - name: Download official llama.cpp binary
        if: steps.route.outputs.llm_needed == 'true' && steps.llama-bin-cache.outputs.cache-hit != 'true' && steps.deterministic_force.outputs.ready != 'true'
        run: |
          mkdir -p llama-prebuilt
          curl -fL --retry 3             https://github.com/ggml-org/llama.cpp/releases/download/b11140/llama-b11140-bin-ubuntu-x64.tar.gz             -o llama-b11140.tar.gz
          tar -xzf llama-b11140.tar.gz -C llama-prebuilt
          test -n "$(find llama-prebuilt -type f -name llama-server -print -quit)"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.route.outputs.llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true'
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: ${{ steps.model_profile.outputs.cache_key }}

          # Baseline contract strings retained for static regression: --model qwen2.5-coder-3b; --timeout-seconds 180.
          # Exact-provider FORCE uses the measured CPU default: 3B matched 9B
          # on the fixed diagnostics and completed far faster, while the real
          # private 7B Sekai oracle exhausted two long inference budgets.
          # Keep larger models as explicit challengers; memory quality and
          # current evidence are evaluated independently of parameter count.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: steps.route.outputs.llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true' && steps.model_profile.outputs.profile == 'qwen35-9b'
        id: qwen35-9b-cache
        with:
          path: .brain-models/qwen35-9b-q4.gguf
          key: qwen35-9b-q4-ef6f244d

      - name: Download hash-pinned Qwen3.5 9B challenger weights
        if: steps.route.outputs.llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true' && steps.model_profile.outputs.profile == 'qwen35-9b' && steps.qwen35-9b-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .brain-models
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 2100 \
            'https://huggingface.co/SoAIHQ/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf' \
            -o .brain-models/qwen35-9b-q4.gguf
          printf '%s  %s\n' \
            'ef6f244d63abcba4f8d30b7cbd9369e9e798fc33cf21109889373f59af329c93' \
            '.brain-models/qwen35-9b-q4.gguf' | sha256sum -c -
          echo 'FIELD_BRAIN_LOCAL_MODEL_WEIGHTS profile=qwen35-9b verified=true'

      # Existing NiakVIO live-capture + Brain --live-evidence contract was
      # previously disconnected in this private guidance lane. For a single
      # exact-source representative, observe current provider bytes and network
      # responses before spending the CPU FORCE budget. Never stage nine network
      # probes inside a bounded multi-provider guidance page.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: steps.page.outputs.count == '1' && steps.route.outputs.force_llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true'
        with:
          node-version: '24'

      - name: Capture exact-current provider live preflight for one representative
        id: live_preflight
        if: steps.page.outputs.count == '1' && steps.route.outputs.force_llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true'
        timeout-minutes: 9
        shell: bash
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          # health_provider only selects immutable category-matched repair
          # fixtures when this comparison gate is enabled. Without it the
          # observer runs broad activation fixtures, which the Brain must
          # (correctly) reject as an incomplete current-source repair contract.
          NIAKVIO_REQUIRE_DECODE_PROOF: '1'
        run: |
          set -euo pipefail
          target="$(head -n 1 "$RUNNER_TEMP/niakvio-guidance-page.txt")"
          evidence="$RUNNER_TEMP/niakvio-brain-live-evidence.json"
          # No raw site response or private route may be printed or archived.
          if ! npm ci --prefix niakvio --ignore-scripts --no-audit --no-fund \
              > "$RUNNER_TEMP/niakvio-live-npm.log" 2>&1; then
            echo "FIELD_BRAIN_LIVE_PREFLIGHT provider=$target ready=false reason=tooling_unavailable"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! (cd niakvio && timeout --kill-after=15s 390s \
              python scripts/capture_brain_live_context.py \
                --provider "$target" --output "$evidence") \
              > "$RUNNER_TEMP/niakvio-live-capture.log" 2>&1; then
            rm -f "$evidence"
            echo "FIELD_BRAIN_LIVE_PREFLIGHT provider=$target ready=false reason=capture_failed_or_timeout"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! python - "$evidence" "$target" "${{ steps.source.outputs.sha }}" <<'PY'
          import json,sys
          row=json.load(open(sys.argv[1],encoding="utf-8"))
          assert row.get("provider")==sys.argv[2], "wrong provider preflight"
          assert row.get("sourceSha")==sys.argv[3], "stale source preflight"
          assert row.get("publicationAuthority") is False, "preflight cannot publish"
          assert row.get("fixture_selection_complete") is True, "incomplete strict repair fixture contract"
          assert isinstance(row.get("network_evidence"),list), "missing structured network evidence"
          print(
              "FIELD_BRAIN_LIVE_PREFLIGHT provider="+sys.argv[2]+
              " ready=true exact_source=true network_events="+
              str(len(row["network_evidence"]))+
              " fixture_count="+str(len(row.get("fixture_evidence") or []))+
              " preflight_status="+str(row.get("preflight_status") or "unknown")[:48]+
              " proof_authority=false"
          )
          PY
          then
            rm -f "$evidence"
            echo "FIELD_BRAIN_LIVE_PREFLIGHT provider=$target ready=false reason=invalid_source_or_schema"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "path=$evidence" >> "$GITHUB_OUTPUT"

      - name: Start bounded local Qwen advisor
        if: steps.route.outputs.llm_needed == 'true' && steps.deterministic_force.outputs.ready != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SERVER="$(find llama-prebuilt -type f -name llama-server -print -quit)"
          test -n "$SERVER"
          chmod +x "$SERVER"
          if [ "${{ steps.model_profile.outputs.profile }}" = "qwen35-9b" ]; then
            test -s .brain-models/qwen35-9b-q4.gguf
            "$SERVER" \
              -m .brain-models/qwen35-9b-q4.gguf --alias qwen35-9b \
              --host 127.0.0.1 --port 8080 -t 4 -c 8192 -np 1 --reasoning off \
              > llama-server.log 2>&1 &
          else
            "$SERVER" \
              -hf Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M \
              --host 127.0.0.1 --port 8080 -c 8192 -np 1 \
              > llama-server.log 2>&1 &
          fi
          for i in $(seq 1 240); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat llama-server.log
          exit 1

      - name: Produce private-informed advisor and Force batches
        shell: bash
        env:
          # Already tested in source-model-challenger; keep exact selected JS
          # units and network causality while shrinking duplicate text before
          # CPU-bound 3B inference and each subsequent validation retry.
          NIAKVIO_FORCE_CPU_TIGHT_PROMPT: '1'
        run: |
          set -euo pipefail
          # Generate a bounded portfolio for EVERY provider in the exact
          # guidance page. Never use --stop-after-first-mutation here: the
          # option stops the entire multi-provider batch after a single
          # provider yields a candidate, silently starving its siblings.
          # Each provider retains its independent bounded FORCE budget.
          provider_args=()
          while IFS= read -r provider; do
            [ -z "$provider" ] || provider_args+=(--provider "$provider")
          done < "$RUNNER_TEMP/niakvio-guidance-page.txt"
          live_args=()
          if [ "${{ steps.live_preflight.outputs.ready }}" = "true" ]; then
            live_args=(--live-evidence "${{ steps.live_preflight.outputs.path }}")
          fi
          if [ "${{ steps.deterministic_force.outputs.ready }}" = "true" ]; then
            cp private-force-deterministic.jsonl private-force-batch.jsonl
            : > private-guided-batch.jsonl
            echo "FIELD_BRAIN_FORCE_MODEL_BYPASS deterministic=true"
            exit 0
          fi
          python brain/scripts/plan_batch_from_checkout.py \
            --niakvio-root niakvio \
            --experience public-experience.jsonl \
            --documents public-documents.jsonl \
            --extra-documents private-documents.jsonl \
            "${live_args[@]}" \
            --mode repair \
            --max-hypotheses 4 \
            "${provider_args[@]}" \
            --endpoint http://127.0.0.1:8080 \
            --model "${{ steps.model_profile.outputs.model }}" \
            --workers 1 \
            --max-tokens 512 \
            --timeout-seconds "${{ steps.model_profile.outputs.force_timeout }}" \
            --force-provider-budget-seconds "${{ steps.model_profile.outputs.provider_budget }}" \
            --output private-force-batch.jsonl
          # FORCE already supplied the strictly non-mutating causal diagnosis
          # on the exact published JS. Avoid a second slow, equivalent local
          # model call only when every targeted provider has a completed,
          # non-abstaining model diagnosis and zero executable authority.
          # All other routes still run the independent advisor unchanged.
          if python brain/scripts/reuse_force_diagnostic_for_advisor.py \
              --force-batch private-force-batch.jsonl \
              --targets "$RUNNER_TEMP/niakvio-guidance-page.txt" \
              --niakvio-root niakvio; then
            : > private-guided-batch.jsonl
            echo "FIELD_BRAIN_DIAGNOSIS_ADVISOR_REUSE completed=true source_pinned=true mutation_authority=false"
          else
            python brain/scripts/plan_batch_from_checkout.py \
              --niakvio-root niakvio \
              --experience public-experience.jsonl \
              --documents public-documents.jsonl \
              --extra-documents private-documents.jsonl \
              "${live_args[@]}" \
              --mode brain \
            "${provider_args[@]}" \
            --endpoint http://127.0.0.1:8080 \
            --model "${{ steps.model_profile.outputs.model }}" \
            --workers 1 \
            --advisor-only \
            --max-tokens 160 \
            --timeout-seconds "${{ steps.model_profile.outputs.advisor_timeout }}" \
              --output private-guided-batch.jsonl
          fi

      - name: Sanitize advisor output
        shell: bash
        env:
          FORCE_LLM_TARGETS: ${{ steps.route.outputs.force_llm_targets || '0' }}
        run: |
          set -euo pipefail
          brain_sha="$(git -C brain rev-parse HEAD)"
          # Paged source-pinned causal memory is hypotheses only; no raw
          # model output, executable mutations, secrets, or playback promotion.
          git -C brain fetch origin "+refs/heads/niakvio-guidance:refs/remotes/origin/niakvio-guidance" || true
          causal_previous_args=()
          if git -C brain show "refs/remotes/origin/niakvio-guidance:guidance/niakvio-causal-diagnostics.json" > "$RUNNER_TEMP/niakvio-causal.previous.json" 2>/dev/null; then
            causal_previous_args=(--previous "$RUNNER_TEMP/niakvio-causal.previous.json")
          fi
          python brain/scripts/publish_niakvio_causal_diagnostics.py \
            --input private-force-batch.jsonl \
            --output niakvio-causal-diagnostics.json \
            "${causal_previous_args[@]}" \
            --niakvio-sha "${{ steps.source.outputs.sha }}" \
            --brain-llm-sha "$brain_sha"
          python brain/scripts/publish_niakvio_guidance.py             --input private-guided-batch.jsonl             --output niakvio-guidance.json             --niakvio-root niakvio             --niakvio-sha "${{ steps.source.outputs.sha }}"             --brain-llm-sha "$brain_sha"
          python brain/scripts/publish_niakvio_force_mutations.py             --input private-force-batch.jsonl             --output niakvio-force-mutations.json             --niakvio-root niakvio             --niakvio-sha "${{ steps.source.outputs.sha }}"             --brain-llm-sha "$brain_sha"
          python brain/scripts/publish_niakvio_force_diagnostics.py             --input private-force-batch.jsonl             --output niakvio-force-diagnostics.json             --niakvio-sha "${{ steps.source.outputs.sha }}"             --brain-llm-sha "$brain_sha"
          python - <<'PY'
          import json,os,re
          d=json.load(open("niakvio-guidance.json"))
          assert d["privateContentRetained"] is False
          assert d["proofAuthority"] is False
          assert d["directMutationAuthority"] is False
          assert d["publicationAuthority"] is False
          serialized=json.dumps(d)
          assert not re.search(r"https?://|authorization[=:]|cookie[=:]|token[=:]",serialized,re.I)
          allowed={"providerId","failureClass","targetLayer","strategy","profile","confidence","priorOnly","experiment","experimentFingerprint"}
          exp_allowed={"routePolicy","recipePolicy","roleOrder","terminalOnly","aliasSearch","responseSalvage","documentRequestMining","sessionBootstrap","maxDepth","maxPages","maxEmbeds","maxRecipePasses"}
          assert d.get("schemaVersion")==2
          for row in d["rows"]:
              assert set(row)<=allowed
              assert set(row.get("experiment") or {})==exp_allowed
              assert re.fullmatch(r"[0-9a-f]{64}",str(row.get("experimentFingerprint") or ""))
          print("FIELD_NIAKVIO_GUIDANCE_SANITIZED "
                f"providers={d['providerCount']} rows={len(d['rows'])} private_content=false")
          force=json.load(open("niakvio-force-mutations.json"))
          assert force.get("schemaVersion")==1
          assert force.get("sandboxMutationAuthority") is True
          assert force.get("publicationAuthority") is False
          assert force.get("proofAuthority") is False
          assert force.get("privateContentRetained") is False
          force_targets=int(os.environ.get("FORCE_LLM_TARGETS") or 0)
          if force_targets > 0 and int(force.get("providerCount") or 0) <= 0:
              # Advisor guidance remains useful and non-mutating even when the
              # concrete Force generator abstains or fails. Do not throw away
              # valid multi-hypothesis guidance. NiakVIO explicit Force still
              # fails closed later when requireExternalForceMutations=true.
              print(
                  "FIELD_NIAKVIO_FORCE_MUTATIONS_READY ready=false "
                  f"requested={force_targets} reason=no-executable-mutation"
              )
          else:
              print(
                  "FIELD_NIAKVIO_FORCE_MUTATIONS_READY ready=true "
                  f"requested={force_targets} providers={int(force.get('providerCount') or 0)}"
              )
          allowed_scopes={"provider_data","provider_patch","provider_bloc","provider_js"}
          for row in force.get("rows") or []:
              assert row.get("targetLayer")=="provider"
              assert re.fullmatch(r"[0-9a-f]{64}",str(row.get("mutationFingerprint") or ""))
              assert re.fullmatch(r"[0-9a-f]{64}",str(row.get("mutationContextFingerprint") or ""))
              mutations=row.get("mutations") or []
              assert mutations
              assert all(str(m.get("scope") or "") in allowed_scopes for m in mutations)
          print("FIELD_NIAKVIO_FORCE_MUTATIONS_SANITIZED "
                f"providers={force['providerCount']} rows={len(force['rows'])} publication=false")
          diag=json.load(open("niakvio-force-diagnostics.json"))
          assert diag.get("schemaVersion")==1
          assert diag.get("privateContentRetained") is False
          assert diag.get("proofAuthority") is False
          assert diag.get("publicationAuthority") is False
          serialized_diag=json.dumps(diag)
          assert not re.search(r"https?://|authorization[=:]|cookie[=:]|token[=:]",serialized_diag,re.I)
          print("FIELD_NIAKVIO_FORCE_DIAGNOSTICS_SANITIZED "
                f"providers={diag.get('providerCount',0)} rows={len(diag.get('rows') or [])} private_content=false")
          PY

      - name: Delete ephemeral private/model context
        if: always()
        run: |
          rm -f private-documents.jsonl private-guided-batch.jsonl private-force-batch.jsonl private-force-deterministic.jsonl public-documents.jsonl public-experience.jsonl
          rm -f niakvio/automation/brain-causal-diagnostics-history.json "$RUNNER_TEMP/niakvio-causal-history.json"
          rm -f "$RUNNER_TEMP/niakvio-brain-live-evidence.json" "$RUNNER_TEMP/niakvio-live-npm.log" "$RUNNER_TEMP/niakvio-live-capture.log"
          rm -rf private

      - name: Publish merged paged guidance ref
        id: publish
        shell: bash
        env:
          BRANCH: niakvio-guidance
        run: |
          set -euo pipefail
          git -C brain config user.name "niakvio-brain-llm"
          git -C brain config user.email "actions@users.noreply.github.com"
          candidate_brain="${{ steps.page.outputs.brain_sha }}"
          candidate_source="${{ steps.source.outputs.sha }}"
          git -C brain fetch origin "+refs/heads/main:refs/remotes/origin/main"
          current_main="$(git -C brain rev-parse refs/remotes/origin/main)"
          # A continuation page is intentionally pinned to the Brain revision
          # that published page 1. Brain main may advance while the cycle runs.
          # Allow that exact incomplete cycle to finish, but do not let any
          # other stale run publish after main has moved.
          git -C brain fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          same_incomplete_cycle=false
          if git -C brain show "refs/remotes/origin/$BRANCH:guidance/niakvio-guidance-state.json" > "$RUNNER_TEMP/niakvio-guidance-state.continuation.json" 2>/dev/null; then
            read -r continuation_brain continuation_source continuation_complete < <(python - "$RUNNER_TEMP/niakvio-guidance-state.continuation.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(
              str(d.get("brainLlmSha") or "").strip().lower(),
              str(d.get("sourceNiakvioSha") or "").strip().lower(),
              "true" if d.get("complete") is True else "false",
          )
          PY
            )
            if [ "$continuation_brain" = "$candidate_brain" ] \
               && [ "$continuation_source" = "$candidate_source" ] \
               && [ "$continuation_complete" != "true" ]; then
              same_incomplete_cycle=true
            fi
          fi
          if [ "$candidate_brain" != "$current_main" ]; then
            if git -C brain merge-base --is-ancestor "$candidate_brain" "$current_main"; then
              trigger_only_advance=false
              mapfile -t advanced_paths < <(
                git -C brain diff --name-only "$candidate_brain..$current_main" -- |
                  sed '/^$/d'
              )
              if [ "${#advanced_paths[@]}" -gt 0 ]; then
                trigger_only_advance=true
                for advanced_path in "${advanced_paths[@]}"; do
                  # Long Qwen pages are still source-pinned. Documentation
                  # advances cannot change compiled Brain behavior, and must
                  # not discard hours of sandbox-negative evidence. Any
                  # executable/workflow/config/test change still fails closed.
                  if [ "$advanced_path" != ".github/triggers/niakvio-guidance.json" ] \
                     && [ "$advanced_path" != "MEMORY.md" ] \
                     && [[ "$advanced_path" != docs/* ]]; then
                    trigger_only_advance=false
                    break
                  fi
                done
              fi
              if [ "$same_incomplete_cycle" = "true" ]; then
                echo "FIELD_NIAKVIO_GUIDANCE_CONTINUATION_PIN allowed=true candidate=$candidate_brain current=$current_main source=$candidate_source"
              elif [ "$trigger_only_advance" = "true" ]; then
                echo "FIELD_NIAKVIO_GUIDANCE_TRIGGER_ONLY_ADVANCE allowed=true candidate=$candidate_brain current=$current_main source=$candidate_source"
              else
                echo "published=false" >> "$GITHUB_OUTPUT"
                echo "FIELD_NIAKVIO_GUIDANCE_STALE_PUBLISH skipped=true reason=brain_main_advanced candidate=$candidate_brain current=$current_main"
                exit 0
              fi
            else
              echo "candidate Brain revision diverges from current main; refusing guidance publication" >&2
              exit 5
            fi
          fi
          git -C brain fetch origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH" || true
          expected_sha=""
          previous_advisor_args=()
          previous_force_args=()
          previous_diagnostics_args=()
          if git -C brain rev-parse --verify "refs/remotes/origin/$BRANCH" >/dev/null 2>&1; then
            expected_sha="$(git -C brain rev-parse "refs/remotes/origin/$BRANCH")"
            if git -C brain show "refs/remotes/origin/$BRANCH:guidance/niakvio-guidance.json" > "$RUNNER_TEMP/niakvio-guidance.previous.json" 2>/dev/null; then
              previous_advisor_args=(--previous-advisor "$RUNNER_TEMP/niakvio-guidance.previous.json")
            fi
            if git -C brain show "refs/remotes/origin/$BRANCH:guidance/niakvio-force-mutations.json" > "$RUNNER_TEMP/niakvio-force.previous.json" 2>/dev/null; then
              previous_force_args=(--previous-force "$RUNNER_TEMP/niakvio-force.previous.json")
            fi
            if git -C brain show "refs/remotes/origin/$BRANCH:guidance/niakvio-force-diagnostics.json" > "$RUNNER_TEMP/niakvio-force-diagnostics.previous.json" 2>/dev/null; then
              previous_diagnostics_args=(--previous-diagnostics "$RUNNER_TEMP/niakvio-force-diagnostics.previous.json")
            fi
                    if git -C brain show "refs/remotes/origin/$BRANCH:guidance/niakvio-guidance-state.json" > "$RUNNER_TEMP/niakvio-guidance-state.publish-previous.json" 2>/dev/null; then
              read -r published_brain published_source < <(python - "$RUNNER_TEMP/niakvio-guidance-state.publish-previous.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          print(str(d.get("brainLlmSha") or "").strip().lower(), str(d.get("sourceNiakvioSha") or "").strip().lower())
          PY
              )
              candidate_brain="${{ steps.page.outputs.brain_sha }}"
              candidate_source="${{ steps.source.outputs.sha }}"
              if [ -n "$published_brain" ] && [ "$published_brain" != "$candidate_brain" ]; then
                if git -C brain merge-base --is-ancestor "$candidate_brain" "$published_brain"; then
                  echo "published=false" >> "$GITHUB_OUTPUT"
                  echo "FIELD_NIAKVIO_GUIDANCE_STALE_PUBLISH skipped=true reason=newer_brain_already_published candidate=$candidate_brain published=$published_brain"
                  exit 0
                fi
                if ! git -C brain merge-base --is-ancestor "$published_brain" "$candidate_brain"; then
                  echo "published Brain revision diverges from candidate; refusing destructive guidance overwrite" >&2
                  exit 3
                fi
              elif [ -n "$published_brain" ] && [ "$published_brain" = "$candidate_brain" ] \
                   && [ -n "$published_source" ] && [ "$published_source" != "$candidate_source" ]; then
                echo "same Brain revision already published for a different NiakVIO source; refusing ambiguous overwrite" >&2
                exit 4
              fi
            fi
          fi
          python brain/scripts/merge_niakvio_guidance_page.py \
            "${previous_advisor_args[@]}" \
            "${previous_force_args[@]}" \
            "${previous_diagnostics_args[@]}" \
            --candidate-advisor niakvio-guidance.json \
            --candidate-force niakvio-force-mutations.json \
            --candidate-diagnostics niakvio-force-diagnostics.json \
            --refreshed-providers "$RUNNER_TEMP/niakvio-guidance-page.txt" \
            --advisor-output "$RUNNER_TEMP/niakvio-guidance.merged.json" \
            --force-output "$RUNNER_TEMP/niakvio-force.merged.json" \
            --diagnostics-output "$RUNNER_TEMP/niakvio-force-diagnostics.merged.json"
          cp "$RUNNER_TEMP/niakvio-guidance.merged.json" niakvio-guidance.json
          cp "$RUNNER_TEMP/niakvio-force.merged.json" niakvio-force-mutations.json
          cp "$RUNNER_TEMP/niakvio-force-diagnostics.merged.json" niakvio-force-diagnostics.json

          git -C brain switch --orphan "niakvio-guidance-$GITHUB_RUN_ID"
          git -C brain rm -rf . >/dev/null 2>&1 || true
          mkdir -p brain/guidance
          cp niakvio-guidance.json brain/guidance/niakvio-guidance.json
          cp niakvio-force-mutations.json brain/guidance/niakvio-force-mutations.json
          cp niakvio-force-diagnostics.json brain/guidance/niakvio-force-diagnostics.json
          cp niakvio-causal-diagnostics.json brain/guidance/niakvio-causal-diagnostics.json
          cp "$RUNNER_TEMP/niakvio-guidance-state.next.json" brain/guidance/niakvio-guidance-state.json
          git -C brain add guidance/niakvio-guidance.json guidance/niakvio-force-mutations.json guidance/niakvio-force-diagnostics.json guidance/niakvio-guidance-state.json guidance/niakvio-causal-diagnostics.json
          git -C brain commit -m "guidance: merge NiakVIO advisor page ${{ steps.page.outputs.cycle }}"
          tracked="$(git -C brain ls-files | sort)"
          expected_tracked="$(printf '%s\n' guidance/niakvio-causal-diagnostics.json guidance/niakvio-force-diagnostics.json guidance/niakvio-force-mutations.json guidance/niakvio-guidance-state.json guidance/niakvio-guidance.json | sort)"
          test "$tracked" = "$expected_tracked"
          if [ -n "$expected_sha" ]; then
            git -C brain push --force-with-lease="$BRANCH:$expected_sha" origin HEAD:"$BRANCH"
          else
            git -C brain push origin HEAD:"$BRANCH"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "FIELD_NIAKVIO_GUIDANCE_PUBLISH files=5 private_content=false force_mutations=true force_diagnostics=true complete=${{ steps.page.outputs.complete }} remaining=${{ steps.page.outputs.remaining }}"

      - name: Continue remaining guidance page
        if: ${{ steps.publish.outputs.published == 'true' && steps.page.outputs.complete != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run niakvio-private-guidance.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f niakvio_sha="${{ steps.source.outputs.sha }}" \
            -f brain_sha="${{ steps.page.outputs.brain_sha }}" \
            -f target_providers="${{ steps.cohort.outputs.csv }}" \
            -f page_size="${{ inputs.page_size || '9' }}" \
            -f model_profile="${{ steps.model_profile.outputs.profile || 'qwen25-coder-3b' }}"
          echo "FIELD_NIAKVIO_GUIDANCE_CONTINUE remaining=${{ steps.page.outputs.remaining }} source=${{ steps.source.outputs.sha }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: niakvio-guidance-${{ github.run_id }}
