name: Local Qwen Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - bootstrap/brain-llm-v0
    paths:
      - ".github/workflows/llm-smoke.yml"
      - "scripts/smoke_local_model.py"
      - "scripts/import_public_niakvio.py"
      - "scripts/import_public_docs.py"
      - "src/niakvio_brain_llm/**"
      - "config/**"

concurrency:
  group: brain-llm-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qwen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Brain LLM
        uses: actions/checkout@v4
        with:
          path: brain

      - name: Checkout NiakVIO read-only
        uses: actions/checkout@v4
        with:
          repository: niakw/NiakVIO
          path: niakvio
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Brain package
        run: python -m pip install -e brain

      - name: Build live public RAG memory
        run: |
          python brain/scripts/import_public_niakvio.py \
            --niakvio-root niakvio \
            --output public-experience.jsonl
          python brain/scripts/import_public_docs.py \
            --niakvio-root niakvio \
            --config brain/config/document_sources.json \
            --output public-documents.jsonl

      - name: Cache llama.cpp build
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: llama.cpp
          key: llama-cpp-server-linux-v1

      - name: Build llama.cpp
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j2 --target llama-server

      - name: Ensure runtime curl dependency
        if: steps.llama-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Cache local model download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: qwen25-coder-15b-q4-km-v1

      - name: Start official Qwen Coder 1.5B Q4
        run: |
          ./llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -np 1 \
            > llama-server.log 2>&1 &
          echo $! > llama-server.pid

          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          cat llama-server.log
          exit 1

      - name: Run NiakVIO Brain model contract smoke
        run: |
          python brain/scripts/smoke_local_model.py \
            --endpoint http://127.0.0.1:8080 \
            --model qwen2.5-coder-1.5b \
            --experience public-experience.jsonl \
            --documents public-documents.jsonl \
            --output qwen-smoke-result.json

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen-local-smoke
          path: |
            qwen-smoke-result.json
            llama-server.log
            public-documents.jsonl
