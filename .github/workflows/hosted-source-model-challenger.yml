name: Brain - Hosted Source Challenger (explicit opt-in, read-only)

on:
  workflow_dispatch:
    inputs:
      provider_id:
        description: One evidence-backed source family representative
        type: choice
        required: true
        options:
          - 4khdhub
          - allanime
          - moviesmod
          - yflix
      model_id:
        description: API model (billable, requires configured secret)
        type: choice
        required: true
        default: gpt-6.1-sol
        options:
          - gpt-6.1-sol
          - gpt-6-astra

permissions:
  contents: read

concurrency:
  group: niakvio-hosted-read-only-challenger
  cancel-in-progress: false

jobs:
  one-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROVIDER_ID: ${{ inputs.provider_id }}
      MODEL_ID: ${{ inputs.model_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO
          ref: main
          path: .challenger/niakvio
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Check opt-in prerequisites and constrained tests
        env:
          NIAKVIO_OPENAI_API_KEY: ${{ secrets.NIAKVIO_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NIAKVIO_OPENAI_API_KEY:-}" ]; then
            echo "FIELD_BRAIN_HOSTED_BLOCKED reason=missing_explicit_secret"
            exit 1
          fi
          python -m pip install -e .
          python -m unittest tests.test_no_paid_api tests.test_source_model_challenger tests.test_api_cost -v
      - name: Compare one hosted candidate against current source (no production publication)
        env:
          NIAKVIO_ALLOW_PAID_API: '1'
          NIAKVIO_OPENAI_API_KEY: ${{ secrets.NIAKVIO_OPENAI_API_KEY }}
          NIAKVIO_API_BUDGET_USD: '0.50'
          NIAKVIO_API_BUDGET_LEDGER: ${{ github.workspace }}/.challenger/hosted-cost-ledger.json
        run: |
          set -euo pipefail
          mkdir -p .challenger
          python -m benchmark.source_model_challenger \
            --backend hosted --niakvio-root .challenger/niakvio \
            --provider "$PROVIDER_ID" --model "$MODEL_ID" \
            --canonical-force --model-only-force \
            --raw-candidates .challenger/private-sandbox-input.jsonl \
            --output .challenger/real-source-report.json \
            --max-tokens 2048 --timeout-seconds 300
          python -m json.tool .challenger/real-source-report.json >/dev/null
      - name: Canonical NiakVIO apply and real Deep replay (isolated worktree)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .challenger/private-sandbox-input.jsonl ]; then
            echo "FIELD_BRAIN_HOSTED_REPLAY no_admissible_candidate=true publish=false"
            exit 0
          fi
          niak_sha="$(git -C .challenger/niakvio rev-parse HEAD)"
          python scripts/publish_niakvio_force_mutations.py \
            --input .challenger/private-sandbox-input.jsonl \
            --output .challenger/private-force-payload.json \
            --niakvio-root .challenger/niakvio \
            --niakvio-sha "$niak_sha" --brain-llm-sha "$GITHUB_SHA"
          count="$(python -c 'import json; print(json.load(open(".challenger/private-force-payload.json"))["providerCount"])')"
          if [ "$count" != 1 ]; then
            echo "FIELD_BRAIN_HOSTED_REPLAY sanitizer_rejected=true publish=false"
            exit 0
          fi
          python .challenger/niakvio/scripts/apply_brain_llm_force_mutations.py \
            --input "$(pwd)/.challenger/private-force-payload.json" \
            --current-sha "$niak_sha" --provider "$PROVIDER_ID" \
            --report "$(pwd)/.challenger/private-apply-report.json"
          applied="$(python -c 'import json; print(json.load(open(".challenger/private-apply-report.json"))["appliedProviderCount"])')"
          if [ "$applied" != 1 ]; then
            echo "FIELD_BRAIN_HOSTED_REPLAY canonical_apply_rejected=true publish=false"
            exit 0
          fi
          (
            cd .challenger/niakvio
            npm ci --ignore-scripts --no-audit --no-fund
            python scripts/materialize_provider_v3_one.py "$PROVIDER_ID"
            python scripts/stage_published.py
            NUVIO_HEALTH_PROVIDER_FILTER="$PROVIDER_ID" \
              NUVIO_HEALTH_OUTPUT="$GITHUB_WORKSPACE/.challenger/deep-output" \
              node scripts/health_check.mjs --deep
          )
          NIAKVIO_SOURCE_SHA="$niak_sha" python -m benchmark.source_replay_evidence \
            --input .challenger/deep-output/health-results.json \
            --provider "$PROVIDER_ID" \
            --output .challenger/source-sandbox-result.json
      - name: Upload sanitized diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-hosted-source-diagnostic
          path: |
            .challenger/real-source-report.json
            .challenger/source-sandbox-result.json
          retention-days: 7
          if-no-files-found: warn
