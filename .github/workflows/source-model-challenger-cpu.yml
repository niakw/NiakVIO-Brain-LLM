name: Brain - Real Source CPU Challenger (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'benchmark/source_model_challenger.py'
      - '.github/workflows/source-model-challenger-cpu.yml'

permissions:
  contents: read

concurrency:
  group: niakvio-source-cpu-challenger
  cancel-in-progress: false

jobs:
  current-source:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: niakw/NiakVIO
          ref: main
          path: .challenger/niakvio
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install only public, local Brain
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m unittest tests.test_no_paid_api tests.test_source_model_challenger -v
      - name: Reuse verified pinned CPU inference runtime
        run: |
          set -euo pipefail
          mkdir -p .challenger/runtime
          curl -fLsS --retry 4 --retry-all-errors --connect-timeout 20 --max-time 180 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11140/llama-b11140-bin-ubuntu-x64.tar.gz \
            -o .challenger/llama.tar.gz
          printf '%s  %s\n' '460c45fa8a9ebc36c9b08e3a15c06dbdbeb312c6308599521c84d9e7f92a268b' '.challenger/llama.tar.gz' | sha256sum -c -
          tar -xf .challenger/llama.tar.gz -C .challenger/runtime
      - name: Reuse verified pinned public 9B weights
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 2100 \
            'https://huggingface.co/SoAIHQ/Qwen3.5-9B-GGUF/resolve/main/Qwen3.5-9B-Q4_K_M.gguf' \
            -o .challenger/qwen35-9b-q4.gguf
          printf '%s  %s\n' 'ef6f244d63abcba4f8d30b7cbd9369e9e798fc33cf21109889373f59af329c93' '.challenger/qwen35-9b-q4.gguf' | sha256sum -c -
      - name: Start local model (no paid or remote inference)
        run: |
          set -euo pipefail
          binary="$(find .challenger/runtime -type f -name llama-server -print -quit)"
          test -n "$binary"
          chmod +x "$binary"
          "$binary" -m .challenger/qwen35-9b-q4.gguf \
            --alias qwen35-9b --host 127.0.0.1 --port 8080 \
            -t 4 -c 8192 -np 1 --reasoning off > .challenger/server.log 2>&1 &
          for n in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Generate a production-normalized Brain FORCE candidate (ephemeral)
        run: |
          set -euo pipefail
          timeout 12m python benchmark/source_model_challenger.py \
            --niakvio-root .challenger/niakvio \
            --provider 4khdhub --canonical-force \
            --raw-candidates .challenger/private-sandbox-input.jsonl \
            --output .challenger/real-source-report.json \
            --model qwen35-9b --max-tokens 768 --timeout-seconds 420
          python -m json.tool .challenger/real-source-report.json >/dev/null
      - name: Feed the generated proposal through canonical Brain FORCE application in isolated checkout
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .challenger/private-sandbox-input.jsonl ]; then
            echo "FIELD_BRAIN_REAL_SOURCE_SANDBOX no_admissible_candidate=true"
            exit 0
          fi
          niak_sha="$(git -C .challenger/niakvio rev-parse HEAD)"
          python scripts/publish_niakvio_force_mutations.py \
            --input .challenger/private-sandbox-input.jsonl \
            --output .challenger/private-force-payload.json \
            --niakvio-root .challenger/niakvio \
            --niakvio-sha "$niak_sha" --brain-llm-sha "$GITHUB_SHA"
          count="$(python -c 'import json; print(json.load(open(".challenger/private-force-payload.json"))["providerCount"])')"
          if [ "$count" != 1 ]; then
            echo "FIELD_BRAIN_REAL_SOURCE_SANDBOX force_sanitizer_rejected=true"
            exit 0
          fi
          python .challenger/niakvio/scripts/apply_brain_llm_force_mutations.py \
            --input "$(pwd)/.challenger/private-force-payload.json" \
            --current-sha "$niak_sha" --provider 4khdhub \
            --report "$(pwd)/.challenger/private-apply-report.json"
          applied="$(python -c 'import json; print(json.load(open(".challenger/private-apply-report.json"))["appliedProviderCount"])')"
          if [ "$applied" != 1 ]; then
            echo "FIELD_BRAIN_REAL_SOURCE_SANDBOX canonical_apply_not_accepted=true"
            exit 0
          fi
          (
            cd .challenger/niakvio
            npm ci --ignore-scripts --no-audit --no-fund
            python scripts/materialize_provider_v3_one.py 4khdhub
            python scripts/stage_published.py
            NUVIO_HEALTH_PROVIDER_FILTER=4khdhub \
              NUVIO_HEALTH_OUTPUT="$GITHUB_WORKSPACE/.challenger/deep-output" \
              node scripts/health_check.mjs --deep
          )
          python - <<'PY'
          import json
          from pathlib import Path
          output=Path(".challenger/deep-output/health-results.json")
          report=json.load(output.open())
          results=report.get("results") or []
          assert len(results)==1
          r=results[0]
          tests=r.get("tests") or []
          playable=sum(int(t.get("streams_playable") or 0) for t in tests)
          identity=sum(int(t.get("identity_verified_streams") or 0) for t in tests)
          summary={"sourceSha":str(report.get("environment",{}).get("commit") or ""),
                   "provider":"4khdhub",
                   "status":r.get("status"),"playable":playable,"identityVerified":identity,
                   "candidateMaterialized":True,"sandboxExecuted":True,
                   "validated":playable>0 and identity>0,
                   "published":False}
          Path(".challenger/source-sandbox-result.json").write_text(json.dumps(summary,indent=2)+"\\n")
          print("FIELD_BRAIN_REAL_SOURCE_REPLAY materialized=true playback=%d identity=%d publish=false" %
                (playable,identity))
          PY
      - name: Upload sanitized read-only diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: brain-qwen35-9b-real-source-diagnostic
          path: |
            .challenger/real-source-report.json
            .challenger/source-sandbox-result.json
          retention-days: 7
          if-no-files-found: warn
