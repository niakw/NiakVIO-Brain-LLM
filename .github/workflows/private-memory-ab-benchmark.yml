name: Brain Private Memory A/B Benchmark

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/private-memory-ab-benchmark.yml"

permissions:
  contents: read

concurrency:
  group: private-memory-ab-benchmark
  cancel-in-progress: true

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        memory_mode: [public_only, public_plus_private]
        shard: [0, 1]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout Brain
        uses: actions/checkout@v4
        with:
          path: brain

      - name: Checkout NiakVIO read-only
        uses: actions/checkout@v4
        with:
          repository: niakw/NiakVIO
          path: niakvio
          persist-credentials: false

      - name: Checkout niakvio-private read-only
        if: matrix.memory_mode == 'public_plus_private'
        uses: actions/checkout@v4
        with:
          repository: niakw/niakvio-private
          ref: main
          token: ${{ secrets.NIAKVIO_PRIVATE_READ_TOKEN }}
          path: private
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -e brain

      - name: Build public benchmark memories
        run: |
          python brain/scripts/import_public_niakvio.py \
            --niakvio-root niakvio \
            --output public-experience.jsonl
          python brain/scripts/import_public_docs.py \
            --niakvio-root niakvio \
            --config brain/config/document_sources.json \
            --output public-documents.jsonl
          python brain/benchmark/build_public_golden_cases.py \
            --seed niakvio/automation/brain-historical-experience-seed.json \
            --output expanded-golden-cases.jsonl
          python brain/benchmark/shard_jsonl.py \
            --input expanded-golden-cases.jsonl \
            --output shard-cases.jsonl \
            --shard-index ${{ matrix.shard }} \
            --shard-count 2

      - name: Build ephemeral private memory
        if: matrix.memory_mode == 'public_plus_private'
        run: |
          python brain/scripts/import_private_chat_project.py \
            --project-root private/raw/chatgpt-project/g-p-6a7f1d27495c819182b4081bfccdafd8 \
            --output private-chat-documents.jsonl \
            | tee private-memory-report.json

      - uses: actions/cache@v4
        id: llama-cache
        with:
          path: llama.cpp
          key: llama-cpp-server-linux-v1

      - if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cmake -S llama.cpp -B llama.cpp/build \
            -DGGML_NATIVE=OFF \
            -DLLAMA_CURL=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build llama.cpp/build --config Release -j2 --target llama-server

      - if: steps.llama-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/llama.cpp
            ~/.cache/huggingface
          key: qwen25-coder-3b-q4-km-v1

      - name: Start Qwen2.5 Coder 3B
        run: |
          ./llama.cpp/build/bin/llama-server \
            -hf Qwen/Qwen2.5-Coder-3B-Instruct-GGUF:Q4_K_M \
            --host 127.0.0.1 \
            --port 8080 \
            -c 4096 \
            -np 1 \
            > llama-server.log 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat llama-server.log
          exit 1

      - name: Run A/B shard
        run: |
          EXTRA=""
          if [ "${{ matrix.memory_mode }}" = "public_plus_private" ]; then
            EXTRA="--extra-documents private-chat-documents.jsonl"
          fi
          python brain/benchmark/golden_model_benchmark.py \
            --cases shard-cases.jsonl \
            --experience public-experience.jsonl \
            --documents public-documents.jsonl \
            $EXTRA \
            --endpoint http://127.0.0.1:8080 \
            --model qwen2.5-coder-3b \
            | tee benchmark-${{ matrix.memory_mode }}-${{ matrix.shard }}.json

      - name: Remove private memory
        if: always()
        run: rm -f private-chat-documents.jsonl private-memory-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-${{ matrix.memory_mode }}-${{ matrix.shard }}
          path: benchmark-${{ matrix.memory_mode }}-${{ matrix.shard }}.json

  compare:
    needs: benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brain

      - uses: actions/download-artifact@v4
        with:
          pattern: ab-*
          path: shards
          merge-multiple: true

      - name: Merge both modes
        run: |
          python brain/benchmark/merge_benchmark_reports.py \
            shards/benchmark-public_only-0.json \
            shards/benchmark-public_only-1.json \
            --output public-only.json
          python brain/benchmark/merge_benchmark_reports.py \
            shards/benchmark-public_plus_private-0.json \
            shards/benchmark-public_plus_private-1.json \
            --output public-plus-private.json

      - name: Compare
        run: |
          python - <<'PY' | tee memory-ab-summary.json
          import json
          from pathlib import Path

          public = json.loads(Path("public-only.json").read_text())
          private = json.loads(Path("public-plus-private.json").read_text())
          keys = (
              "schema_valid",
              "provider_id_ok",
              "layer_ok",
              "strategy_ok",
              "mutation_policy_ok",
              "mutation_valid",
              "abstain_policy_ok",
              "brain_verification_plan_ok",
              "fully_compliant",
          )
          result = {
              "cases": public["cases"],
              "public_only": {k: public["rates"][k] for k in keys},
              "public_plus_private": {k: private["rates"][k] for k in keys},
              "delta": {
                  k: round(private["rates"][k] - public["rates"][k], 6)
                  for k in keys
              },
              "private_memory_hit_cases": sum(
                  1 for row in private["results"]
                  if int(row.get("private_document_hits") or 0) > 0
              ),
              "private_content_uploaded": False,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: private-memory-ab-summary
          path: |
            public-only.json
            public-plus-private.json
            memory-ab-summary.json
