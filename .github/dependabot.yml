# Dependabot monitors the Brain's actual package manifests and SHA-pinned Actions.
# Updates are proposed for review only; CI and supply-chain pinning stay mandatory.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
